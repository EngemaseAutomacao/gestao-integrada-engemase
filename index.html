<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007BFF" />
    <title>Sistema de Gestão de Ativos</title>
    <meta name="description" content="Sistema de gestão de ativos, ferramentas e veículos para Engemase Engenharia. Gerencie recursos de forma eficiente.">
    <meta name="keywords" content="gestão de recursos, controle de ferramentas, controle de veículos, Engemase, engenharia">
    <meta name="author" content="Engemase Engenharia" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gestão de Ativos" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://engemase-tools.lovable.app/" />
    
    
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:title" content="Sistema de Gestão de Ativos">
  <meta name="twitter:title" content="Sistema de Gestão de Ativos">
  <meta property="og:description" content="Sistema de gestão de ativos, ferramentas e veículos para Engemase Engenharia. Gerencie recursos de forma eficiente.">
  <meta name="twitter:description" content="Sistema de gestão de ativos, ferramentas e veículos para Engemase Engenharia. Gerencie recursos de forma eficiente.">
</head>

  <body>
    <div id="root">
      <!-- PWA Splash Screen (shown before React loads) -->
      <div id="splash-screen" style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 50%, #e8f2ff 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 2rem;
        text-align: center;
      ">
        <img src="/icon.png" alt="Engemase" style="width: 72px; height: 56px; border-radius: 14px; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(0,123,255,0.2); object-fit: contain;" />
        <h1 style="font-size: 1.5rem; font-weight: 700; color: #1a2a3a; margin: 0 0 0.25rem 0;">Gestão de Ativos</h1>
        <p style="font-size: 0.8rem; color: #007BFF; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 1.5rem 0;">Engemase Engenharia</p>
        <div style="margin-bottom: 1.5rem;">
          <svg width="40" height="40" viewBox="0 0 40 40" style="animation: splash-spin 1s linear infinite;">
            <circle cx="20" cy="20" r="16" fill="none" stroke="#e0edff" stroke-width="3"/>
            <circle cx="20" cy="20" r="16" fill="none" stroke="#007BFF" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="60" stroke-linecap="round"/>
          </svg>
        </div>
        <p style="font-size: 0.85rem; color: #6b7f96; margin: 0; max-width: 280px; line-height: 1.5;">
          Controle inteligente de ferramentas e veículos para sua operação
        </p>
      </div>
      <style>
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        @media (prefers-color-scheme: dark) {
          #splash-screen {
            background: linear-gradient(135deg, #1a2537 0%, #1e2d40 50%, #1a2537 100%) !important;
          }
          #splash-screen h1 { color: #f0f0f0 !important; }
          #splash-screen p:last-child { color: #8899aa !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA — skip in editor preview to avoid stale cache issues
      if ('serviceWorker' in navigator && !window.location.hostname.endsWith('lovableproject.com')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
