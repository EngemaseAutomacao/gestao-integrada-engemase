<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>Gestão Integrada Engemase</title>
    <meta name="description" content="Gestão integrada de ferramentas, veículos e jornada para Engemase Engenharia. Gerencie todos os recursos de forma eficiente.">
    <meta name="keywords" content="gestão integrada, controle de ferramentas, controle de veículos, ponto, Engemase, engenharia">
    <meta name="author" content="Engemase Engenharia" />
    <link rel="canonical" href="https://gestao-integrada-engemase.lovable.app/" />
    
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gestão Integrada" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gestao-integrada-engemase.lovable.app/" />
    <meta property="og:title" content="Gestão Integrada Engemase — Controle de Ferramentas e Veículos" />
    <meta property="og:description" content="Sistema interno da Engemase Engenharia para controle de ferramentas, veículos e jornada de trabalho." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gestão Integrada Engemase — Controle de Ferramentas e Veículos" />
    <meta name="twitter:description" content="Sistema interno da Engemase Engenharia para controle de ferramentas, veículos e jornada de trabalho." />

    <!-- Structured data -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Engemase Engenharia","url":"https://gestao-integrada-engemase.lovable.app/"}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"Gestão Integrada Engemase","url":"https://gestao-integrada-engemase.lovable.app/","description":"Sistema interno da Engemase Engenharia para controle de ferramentas, veículos e jornada de trabalho."}
    </script>
</head>

  <body>
    <!-- Splash Screen (unique loading - hidden by React when ready) -->
    <div id="splash-screen" style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 50%, #e8f2ff 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      text-align: center;
      transition: opacity 0.3s ease;
    ">
      <img src="/icon.png" alt="Engemase" style="width: 72px; height: 56px; border-radius: 14px; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(0,123,255,0.2); object-fit: contain;" />
      <h1 style="font-size: 1.5rem; font-weight: 700; color: #1a2a3a; margin: 0 0 0.25rem 0;">Gestão Integrada</h1>
      <p style="font-size: 0.8rem; color: #007BFF; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 1.5rem 0;">Engemase Engenharia</p>
      <div style="margin-bottom: 1.5rem;">
        <svg width="40" height="40" viewBox="0 0 40 40" style="animation: splash-spin 1s linear infinite;">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#e0edff" stroke-width="3"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="#007BFF" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="60" stroke-linecap="round"/>
        </svg>
      </div>
      <p style="font-size: 0.85rem; color: #6b7f96; margin: 0; max-width: 280px; line-height: 1.5;">
        Controle inteligente de ferramentas, veículos e jornada
      </p>
    </div>
    <style>
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #splash-screen {
          background: linear-gradient(135deg, #1a2537 0%, #1e2d40 50%, #1a2537 100%) !important;
        }
        #splash-screen h1 { color: #f0f0f0 !important; }
        #splash-screen p:last-child { color: #8899aa !important; }
      }
      #gptengineer-badge, [id*="lovable-badge"], [class*="lovable-badge"], .gpt-engineer-badge {
        display: none !important;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker é registrado pelo wrapper guardado em src/lib/registerSW.ts -->

  </body>
</html>
